# ---------------------------------------------------------------------------
# Build the iOS app on a machine that has Xcode, because none of ours does.
#
# There is no Mac here: this box is WSL and the Mac Mini runs Ubuntu. GitHub's
# macOS runners are the Xcode we do not own, and on a PUBLIC repository their
# minutes are free — the 10x macOS multiplier only bills private repos. That is
# the whole reason this is viable rather than a cost decision to argue about.
#
# TWO JOBS, DELIBERATELY SPLIT.
#
# `compile` needs no secrets and no Apple account. It proves the project builds:
# that capacitor synced, that the SPM packages resolved, that the entitlements
# parse, that nothing in the Swift is broken. It runs on every push that touches
# the app, and it is the check that would have caught a broken project days
# before anyone went looking for a Mac.
#
# `archive` signs and uploads, and it is skipped unless the App Store Connect
# credentials are present. A workflow that goes red because a secret has not
# been created yet teaches people to ignore red workflows.
#
# WHY NOT A PODFILE STEP: Capacitor 8 uses Swift Package Manager here
# (ios/App/CapApp-SPM), so there is no `pod install`. Adding one would fail
# looking for a Podfile that does not exist.
# ---------------------------------------------------------------------------
name: iOS

on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  # A second push while a build is running makes the first one irrelevant.
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (unsigned)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # mobile/ has its own package.json on purpose — the repo root's is shared
      # and none of Capacitor belongs in the web build.
      - name: Install Capacitor
        working-directory: mobile
        run: npm ci

      # Copies capacitor.config.ts into the native project and refreshes the
      # plugin list. Without it the app ships whatever config was committed last,
      # which is how a server.url change silently fails to reach a build.
      - name: Sync
        working-directory: mobile
        run: npx cap sync ios

      # Apple REFUSES uploads built against an older SDK — as of now, anything
      # below iOS 26. That rule is enforced at upload, not at build, so a wrong
      # toolchain produces a perfectly good IPA and then fails after the slowest
      # step in the pipeline. Selecting the newest Xcode and asserting the SDK
      # here moves that failure to the top of the job, where it costs seconds.
      - name: Select the newest Xcode and check the SDK
        id: xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null \
            | sort -V | tail -1)
          echo "using $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK: $SDK"
          MAJOR=${SDK%%.*}
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::iOS SDK $SDK is below 26. App Store Connect rejects uploads built with it, and the runner image has nothing newer. Available: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi

      # Unsigned, and a simulator destination, so this needs no certificate and
      # no provisioning profile. It compiles every line the signed build would.
      - name: Build
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The entitlement is the thing that makes passkeys work at all in a
      # WKWebView, and it is easy to lose in a merge without anyone noticing
      # until sign-in fails on a device. Assert it rather than hope.
      - name: Assert the associated-domains entitlement survived
        working-directory: mobile/ios/App
        run: |
          if ! grep -q "webcredentials:empowertours.xyz" App/App.entitlements; then
            echo "::error::App.entitlements no longer declares webcredentials:empowertours.xyz — passkey sign-in cannot work in the WebView without it"
            exit 1
          fi
          echo "associated domains entitlement present"

  archive:
    name: Archive and upload to TestFlight
    needs: compile
    runs-on: macos-26
    timeout-minutes: 60
    # Only when the credentials exist. Secrets are not readable in `if:` on
    # pull requests from forks, and an unsigned fork PR should not try to sign.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Capacitor
        working-directory: mobile
        run: npm ci

      - name: Sync
        working-directory: mobile
        run: npx cap sync ios

      # Bail out politely rather than failing, so the workflow is green until
      # somebody decides to set this up.
      - name: Select the newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check for App Store Connect credentials
        id: creds
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -z "$KEY_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APP_STORE_CONNECT_KEY_ID is not set — skipping the signed build. See mobile/README.md."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # An App Store Connect API key rather than a distribution certificate and
      # a .p12 in a secret. Xcode can then create and refresh provisioning
      # profiles itself with -allowProvisioningUpdates, which means no human
      # ever exports a private key, and there is no certificate to expire
      # silently in eleven months.
      - name: Install the API key
        if: steps.creds.outputs.present == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      # The API key authenticates; it does NOT provide a signing identity. A
      # fresh runner has no certificate at all, and automatic signing responds to
      # that by trying to create a DEVELOPMENT profile — which needs a registered
      # device, which this team does not have and does not need for the App
      # Store. Hence a distribution certificate imported into a throwaway
      # keychain, and manual signing.
      #
      # The keychain is created per-run with a random password, unlocked with a
      # long timeout (codesign prompts and hangs on a relocked keychain), and
      # dies with the runner.
      - name: Install the signing certificate
        if: steps.creds.outputs.present == 'true'
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI authorisation prompt that
          # nothing on a headless runner can answer, and the job hangs to timeout
          # rather than failing.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/dist.p12"
          echo "identities available to codesign:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Manual signing means we supply the profile; -allowProvisioningUpdates
      # does not create one in that mode. This profile matters for one reason
      # beyond existing: it carries the Associated Domains entitlement, without
      # which the archive fails with "requires a provisioning profile with the
      # Associated Domains feature" — and passkeys would not work even if it
      # somehow built.
      - name: Install the provisioning profile
        if: steps.creds.outputs.present == 'true'
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          # Xcode looks these up by UUID, not by filename, so the name on disk
          # is arbitrary but the UUID must be the one inside the file.
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$DIR/$UUID.mobileprovision"
          echo "installed profile $UUID"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract Name raw -

      # MANUAL signing, arrived at the hard way.
      #
      # Automatic signing archives with a DEVELOPMENT identity, and a development
      # profile requires at least one registered device. This team has none and
      # needs none for the App Store, so automatic signing cannot produce an
      # archive here at all — and it reports that as "your team has no devices",
      # which sends you off registering a phone that would not have helped.
      # Overriding the identity while leaving the style automatic just trades it
      # for "conflicting provisioning settings".
      #
      # So: manual style, our own distribution certificate in the keychain, and
      # -allowProvisioningUpdates to let the API key fetch or create the App
      # Store profile.
      - name: Archive
        if: steps.creds.outputs.present == 'true'
        working-directory: mobile/ios/App
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="EmpowerTours App Store CI" \
            archive

      - name: Export the IPA
        if: steps.creds.outputs.present == 'true'
        working-directory: mobile/ios/App
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Upload to TestFlight
        if: steps.creds.outputs.present == 'true'
        working-directory: mobile/ios/App
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$(ls build/ipa/*.ipa | head -1)" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Keep the IPA
        if: steps.creds.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EmpowerTours-ios
          path: mobile/ios/App/build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
