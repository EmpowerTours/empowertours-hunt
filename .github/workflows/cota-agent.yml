# The scheduler that turns /api/cota/agent/run from an endpoint into an agent.
#
# The route is a POLL, not a daemon: one call is one pass over every leash that
# carries an autonomy grant, and then it returns. Nothing inside the app wakes it
# again, so without something calling it on a clock a take-profit that becomes
# true at 3am is simply never noticed.
#
# THIS IS LIVE. Scheduled runs send real orders against real collateral. It ran
# dry from the start and was flipped on 4 October 2026, after one manual live
# run (22:27 UTC) proved the whole path end to end — the CSRF origin check, the
# agent lease, the venue and ledger reads, and a decision recorded as
# authoritative rather than rehearsed. That run chose `holding`, correctly,
# because the open position was not at its take-profit.
#
# What bounds it is the leash, not this file: one market, a maximum notional, a
# maximum leverage, a daily loss ceiling and a trades-per-day count, every one
# of them checked by mayOpen() before an order can leave. The trading key cannot
# withdraw — Perpl enforces that, not us — so the worst case here is a bad
# trade, never a drained account.
#
# TO STOP IT without touching this file: set autonomy to off or exit-only on the
# leash, or revoke the leash, which revokes the grant with it. Both take effect
# on the next run. The grants also carry their own expiry, so it stops itself
# eventually whether or not anybody remembers.
#
# The thing to watch for is the exit policy, which never closes at a loss. A
# poor entry is therefore held indefinitely, and while it is held the agent can
# open nothing else. That is the policy working as instructed, and it is also
# the state most likely to look like the agent has died.
#
# The Origin header is not optional: the app's CSRF middleware rejects a
# cross-origin POST with 403 BEFORE the route runs, so without it every
# scheduled run fails on a status that looks like a bad token and is not.
#
# On timing: GitHub's scheduled workflows are routinely late, by five to twenty
# minutes under load, and five minutes is the floor anyway. That is tolerable
# because the decision is stateless — every run re-reads the venue, the ledger
# and the grant from scratch, so a missed tick leaves nothing to catch up on, it
# only means the agent was slower to notice. Where the lateness does cost
# something, the Chainlink CRE workflow in cre/agent-scheduler covers it — it
# polls every minute ("*/1 * * * *" in its config) and the lease in the route
# stops the two of them acting at once.
#
# THIS COMMENT USED TO SAY THE MAC MINI. It was wrong, and wrong in the most
# expensive way a comment can be: it named a machine that has nothing to do with
# this, so anyone tracing an unexplained decision at 3am would go and look at a
# box in another country. The decisions land on the :10 second every minute,
# which is the CRE's signature, and the Mac Mini was switched off while they
# kept arriving — which is how it was finally caught.

name: cota-agent

on:
  schedule:
    # Every 15 minutes, and GitHub will not honour it precisely in any case —
    # scheduled runs are routinely five to twenty minutes late under load. That
    # is tolerable because each pass re-reads everything from scratch, so a
    # missed tick is only a slower notice, never a gap to catch up on.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Decide and report without sending"
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    # A slow venue read must not leave a job hanging for six hours on the free
    # tier's clock.
    timeout-minutes: 5
    steps:
      - name: Ask the agent to act
        env:
          COTA_AGENT_TOKEN: ${{ secrets.COTA_AGENT_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dryRun }}
        run: |
          set -euo pipefail
          if [ -z "${COTA_AGENT_TOKEN:-}" ]; then
            echo "COTA_AGENT_TOKEN is not set as a repository secret" >&2
            exit 1
          fi
          # -sS: quiet, but still show an error. --fail-with-body: a non-2xx is a
          # failed run AND the body is printed, because the body is where the
          # reason lives.
          curl -sS --fail-with-body \
            --max-time 120 \
            -X POST "https://hunt.empowertours.xyz/api/cota/agent/run" \
            -H "authorization: Bearer ${COTA_AGENT_TOKEN}" \
            -H "Origin: https://hunt.empowertours.xyz" \
            -H "content-type: application/json" \
            -d "{\"dryRun\": ${DRY_RUN}}" \
          | tee /tmp/out.json
          echo
          # Surface the per-hunter decisions in the job summary so a glance at
          # the Actions tab answers "what has it been doing".
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          d = json.load(open("/tmp/out.json"))
          print(f"### cota-agent — {d.get('ran', 0)} leash(es)\n")
          rows = d.get("results") or []
          if not rows:
              print("No leash carries an autonomy grant.")
          for r in rows:
              print(f"- `{r.get('digest','?')[:12]}` **{r.get('act')}** — {r.get('why', '')}")
          PY
